<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NJH 顧客管理</title><link rel="icon" href="./icons/icon-192.png">
<style>
:root{--g:#208b4f;--gl:#e8f4ed;--b:#d6dcd8;--t:#1d2a22;--r:#d01818;--bl:#1747c8}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--t);background:#f6f8f6;padding-bottom:60px}
header{background:var(--g);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:5}
header b{flex:1;font-size:16px}header small{display:block;font-weight:400;font-size:11px;opacity:.9}
button{font:inherit;border:1px solid var(--b);background:#fff;border-radius:8px;padding:7px 12px;color:var(--t)}
header button{background:rgba(255,255,255,.18);color:#fff;border-color:transparent;padding:5px 9px;font-size:13px}
button.p{background:var(--g);color:#fff;border-color:var(--g)}button.on{background:var(--g);color:#fff;border-color:var(--g)}
main{padding:12px;max-width:760px;margin:auto}
input,select,textarea{font:inherit;width:100%;padding:7px 8px;border:1px solid var(--b);border-radius:8px;background:#fff}
input[type=checkbox]{width:20px;height:20px}label{font-size:13px;color:#4b5d52;display:block;margin:8px 0 2px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.li{display:flex;gap:10px;align-items:center;cursor:pointer}.li .no{background:var(--gl);color:var(--g);border-radius:6px;padding:2px 8px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}h3{margin:14px 0 6px;font-size:15px;color:var(--g)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--b);padding:2px;text-align:center;font-size:12px}
td input{width:52px;padding:5px 2px;text-align:center}th{background:var(--gl)}.R{color:var(--r)}.L{color:var(--bl)}
.pct{font-size:20px;font-weight:700}.warn{background:#fff3f0;border:1px solid #f1b5a8;border-radius:8px;padding:6px 10px;color:#a3260f;margin:6px 0}
.ok td,.ok th{font-size:13px}.chk td{padding:3px 6px}.chk td:first-child{text-align:left}
.ord{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ord button{padding:12px 6px}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin-top:10px}.badge{display:inline-block;background:var(--gl);color:var(--g);border-radius:999px;padding:2px 7px;margin:2px;font-size:11px}.repair-row{display:grid;grid-template-columns:125px 1fr 105px 34px;gap:6px;align-items:center;margin-bottom:7px}@media(max-width:560px){.filters{grid-template-columns:1fr 1fr}.repair-row{grid-template-columns:1fr 1fr}.repair-row textarea{grid-column:1/-1}}
</style></head><body>
<header><a href="./index.html" style="background:#ff7a00;color:#fff;font-weight:700;padding:7px 14px;border-radius:999px;text-decoration:none;display:inline-block;font-size:14px;white-space:nowrap">🏠 ホームに戻る</a><button id="back" hidden>←</button><b id="ht">NJH 顧客管理</b><button id="sb">店舗設定</button><button id="bk">バックアップ</button></header>
<main id="m"></main>
<script>
const K='njhc',$=s=>document.querySelector(s),FR=[125,250,500,1000,2000,3000,4000,8000];
const WORDS='からす さかな はさみ ライオン りんご じどうしゃ つくえ ピアノ ひこうき うさぎ ねずみ でんわ めがね えんぴつ バナナ すずめ ポスト とけい ぼうし テレビ'.split(' ');
const SYL={R:[...'アキシタニヨジウクスネハリバオテモワトガ'],L:[...'キタヨウスハバテワガアシニジクネリオモト']};
const COND=[['R','b','右 裸耳'],['R','w','右 装用耳'],['L','b','左 裸耳'],['L','w','左 装用耳']];
const KINKI=['耳の手術を受けたことがある','最近3ヶ月以内に耳漏があった','最近2ヶ月以内に聴力が低下した','最近1ヶ月以内に急に耳鳴りが大きくなった','外耳道に痛みまたはかゆみがある','耳あかが多くたまっている','平均聴力の左右差が25dB以上ある','500・1000・2000Hzに20dB以上の気骨導差がある'];
const BAT=['','312','13','10A','675','充電式'],RC=['','M','P','HP','SP','UP','LP','MP','MR','その他'];
const FORMS=[['Unitron','#0a8f48',[['insera_sr','Insera Smile R'],['moxisr','Moxi S-R'],['vivante','Moxi Vivante R / 312 / RS'],['stride','Stride V-PR'],['stride_sp','Stride V-SP / UP'],['moxiblu','Moxi Blu R / 312'],['uni_mold','RIC用モールド']]],['Beltone','#00528c',[['beltone_custom','充電式オーダーメイド'],['env6264','Envision 62S / 64DW'],['envcros','Envision クロス送信機'],['commence','Commence 62 / 64DW'],['serene6263','Serene 62S / 63DW'],['serene7686','Serene 76 / 86 DW'],['rely_ric','Rely RIC'],['rely_bte','Rely BTE'],['boost_max','Boost Max S'],['boost_ultra','Boost Ultra'],['bel_mold','RIC用モールド']]]];
let D={shop:{},seq:1,cs:[]};try{Object.assign(D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const ls=k=>{try{return localStorage.getItem('njh_'+k)||''}catch(e){return''}};
if(!D.shop.name)D.shop={name:ls('shop'),staff:ls('contact'),tel:ls('tel'),fax:ls('fax'),sno:''};
Object.values(D.cs||[]).forEach(c=>{if(!Array.isArray(c.repairs))c.repairs=[]});
let V={mode:D.shop.name?'list':'setup',id:null,tab:'b',q:'',filter:'all',month:'',bmonth:''};
let _svWarned=false;const sv=()=>{try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){if(!_svWarned){_svWarned=true;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='顧客データ_保存失敗_'+today()+'.json';a.click()}catch(_){}alert('保存できませんでした（端末の容量がいっぱいの可能性があります）。今の顧客データをファイルでダウンロードしました。「バックアップ保存」でも書き出せますので、端末の空きを確保してから復元してください。')}return false}};
const today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newAu=()=>({date:today(),ac:{R:{},L:{}},bc:{R:{},L:{}},ucl:{R:{},L:{}}});
const newEar=()=>({model:'',no:'',vol:'',rc:'',tube:'',ear:'',bat:''});
const newHa=()=>({buy:'',wr:'',wrY:'',lg:'',lgY:'',lgN:'',lgExp:'',lgAmt:'',extra:[],R:newEar(),L:newEar()});
const newC=()=>({id:Date.now(),no:String(D.seq++).padStart(4,'0'),kana:'',name:'',sex:'',birth:'',tel:'',addr:'',au:[newAu()],ha:[newHa()],sp:{date:'',w:{},s:{}},sps:[],cj:{},memo:'',repairs:[]});const inWarrantyWindow=c=>c.ha.some(h=>{if(!h.wr)return false;const t=new Date(today()),d=new Date(h.wr+'T00:00:00'),e=new Date(t);e.setMonth(e.getMonth()+2);return d>=t&&d<=e});const monthMatch=(v,m)=>!m||String(v||'').slice(0,7)===m;
const cur=()=>D.cs.find(c=>c.id===V.id);
function age(b){if(!b)return'';const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>=0&&a<131?a:''}
function gp(o,p){return p.split('.').reduce((x,k)=>x==null?x:x[k],o)}
function sp(o,p,v){const a=p.split('.');a.slice(0,-1).forEach(k=>o=o[k]??(o[k]={}));o[a.at(-1)]=v}
const inp=(p,t='text',x='')=>`<input type="${t}" data-p="${p}" ${x}>`;
const sel=(p,o)=>`<select data-p="${p}">${o.map(v=>`<option>${v}</option>`).join('')}</select>`;
function fill(root,c){root.querySelectorAll('[data-p]').forEach(e=>{const v=gp(c,e.dataset.p);if(e.type=='checkbox')e.checked=!!v;else e.value=v??''})}
function render(){const m=$('#m'),c=cur();$('#back').hidden=V.mode=='list';
if(V.mode=='setup'){$('#ht').textContent='最初の設定';m.innerHTML=`<div class="card"><p>注文書に自動で入る店舗情報を入力してください。</p>
<label>店名（必須）</label><input id="s1" value="${esc(D.shop.name)}"><label>電話番号（例 082-263-8614）</label><input id="s2" type="tel" value="${esc(D.shop.tel)}"><label>FAX番号</label><input id="s3" type="tel" value="${esc(D.shop.fax)}">
<label>ご担当者（任意）</label><input id="s4" value="${esc(D.shop.staff)}"><label>店番（任意）</label><input id="s5" value="${esc(D.shop.sno)}">
<p><button class="p" id="ss">保存して始める</button></p></div>`;
$('#ss').onclick=()=>{const n=$('#s1').value.trim();if(!n)return alert('店名を入力してください');D.shop={name:n,tel:$('#s2').value.trim(),fax:$('#s3').value.trim(),staff:$('#s4').value.trim(),sno:$('#s5').value.trim()};sv();try{[['shop',D.shop.name],['contact',D.shop.staff],['tel',D.shop.tel],['fax',D.shop.fax]].forEach(a=>localStorage.setItem('njh_'+a[0],a[1]||''))}catch(e){}V.mode='list';render()};return}
if(V.mode=='list'){$('#ht').innerHTML=`${esc(D.shop.name)}<small>顧客 ${D.cs.length}名</small>`;m.innerHTML=`<div class="g2" style="grid-template-columns:1fr auto"><input id="q" placeholder="名前・住所・電話・ふりがな・カルテNo検索" value="${esc(V.q)}"><button class="p" id="add">＋顧客追加</button></div><div class="filters"><select id="filter"><option value="all">すべての顧客</option><option value="warranty">保証終了2ヶ月前</option><option value="birth">誕生日（月）</option><option value="purchase">購入年月</option></select><input id="month" type="month" value="${esc(V.month)}"><select id="bmonth"><option value="">月を選択</option><option value="1">1月</option><option value="2">2月</option><option value="3">3月</option><option value="4">4月</option><option value="5">5月</option><option value="6">6月</option><option value="7">7月</option><option value="8">8月</option><option value="9">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option></select></div><div id="ls" style="margin-top:10px"></div>`;$('#filter').value=V.filter;const sync=()=>{$('#month').hidden=V.filter!=='purchase';$('#bmonth').hidden=V.filter!=='birth'};$('#bmonth').value=V.bmonth;sync();const L=()=>{const q=V.q.trim().toLowerCase(),m=V.month,ok=c=>{const t=[c.name,c.kana,c.no,c.addr,c.tel].join('').toLowerCase();return(!q||t.includes(q))&&(V.filter!=='warranty'||inWarrantyWindow(c))&&(V.filter!=='birth'||!V.bmonth||(c.birth&&+String(c.birth).slice(5,7)===+V.bmonth))&&(V.filter!=='purchase'||c.ha.some(h=>h.buy&&monthMatch(h.buy,m)))};$('#ls').innerHTML=D.cs.filter(ok).sort((a,b)=>b.no.localeCompare(a.no)).map(c=>`<div class="card li" data-id="${c.id}"><span class="no">${c.no}</span><div style="flex:1"><b>${esc(c.name)||'（未入力）'}</b><br><small>${esc(c.kana)} ${esc(c.addr)}</small></div>›</div>`).join('')||'<p>条件に一致する顧客がいません。</p>';$('#ls').querySelectorAll('.li').forEach(e=>e.onclick=()=>{V.id=+e.dataset.id;V.mode='edit';V.tab='b';render()})};L();$('#q').oninput=e=>{V.q=e.target.value;L()};$('#filter').onchange=e=>{V.filter=e.target.value;if(V.filter!=='purchase')V.month='';if(V.filter!=='birth')V.bmonth='';sync();L()};$('#month').onchange=e=>{V.month=e.target.value;L()};$('#bmonth').onchange=e=>{V.bmonth=e.target.value;L()};$('#add').onclick=()=>{const n=newC();D.cs.push(n);sv();V.id=n.id;V.mode='edit';V.tab='b';render()};return}
$('#ht').innerHTML=`No.${c.no} ${esc(c.name)||'新規顧客'}<small id="ag"></small>`;
const T=[['b','基本'],['a','聴力'],['h','補聴器'],['s','語音'],['n','相談'],['r','修理'],['o','注文']];
m.innerHTML=`<div class="tabs">${T.map(t=>`<button class="${V.tab==t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div id="tc"></div>`;
m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{V.tab=b.dataset.t;render()});tab(c)}
function tab(c){const x=$('#tc');let h='';
if(V.tab=='b')h=`<div class="card"><label>カルテNo.（自動）</label><input value="${c.no}" readonly><label>ふりがな</label>${inp('kana')}<label>お名前</label>${inp('name')}
<div class="g2"><div><label>性別</label><select data-p="sex"><option value="">—</option><option value="0">男</option><option value="1">女</option></select></div><div><label>生年月日</label>${inp('birth','date')}</div></div>
<label>年齢（自動）</label><div class="pct" id="ag2"></div><label>電話</label>${inp('tel','tel')}<label>住所</label>${inp('addr')}</div><button onclick="del()" style="color:#a3260f">この顧客を削除</button>`;
if(V.tab=='a'){c.au.forEach((a,i)=>{const row=(l,k,e)=>`<tr><th class="${e}">${l}</th>${FR.map(f=>`<td>${inp(`au.${i}.${k}.${e}.${f}`,'number','step="5" inputmode="numeric"')}</td>`).join('')}</tr>`;
h+=`<div class="card"><label>測定日</label>${inp(`au.${i}.date`,'date')}<div class="sc"><table><tr><th></th>${FR.map(f=>`<th>${f}</th>`).join('')}</tr>${row('気導右○','ac','R')}${row('気導左×','ac','L')}${row('骨導右','bc','R')}${row('骨導左','bc','L')}${row('不快右','ucl','R')}${row('不快左','ucl','L')}</table></div>
<div class="g2" id="av${i}"></div><div id="ch${i}"></div></div>`});h+='<button class="p" onclick="addAu()">＋再測定を追加</button>'}
if(V.tab=='h'){c.ha.forEach((a,i)=>{const ear=e=>`<div class="card"><b class="${e}">${e=='R'?'右耳':'左耳'}</b><label>器種名</label>${inp(`ha.${i}.${e}.model`)}<label>器種No.</label>${inp(`ha.${i}.${e}.no`)}
<div class="g2"><div><label>VOL</label><select data-p="ha.${i}.${e}.vol"><option></option><option>有</option><option>無</option></select></div><div><label>レシーバー種類</label>${sel(`ha.${i}.${e}.rc`,RC)}</div>
<div><label>チューブ/レシーバー長さ</label>${inp(`ha.${i}.${e}.tube`,'text','placeholder="例 2番"')}</div><div><label>耳栓</label>${inp(`ha.${i}.${e}.ear`,'text','placeholder="例 オープンM"')}</div></div>
<label>電池</label>${sel(`ha.${i}.${e}.bat`,BAT)}</div>`;
h+=`<h3>${i+1}台目（購入記録）</h3><div class="g2"><div><label>購入年月日</label>${inp(`ha.${i}.buy`,'date')}</div><div><label>保証年月日</label>${inp(`ha.${i}.wr`,'date')}</div></div><div class="g2"><div><label>保証年数（年）</label>${inp(`ha.${i}.wrY`,'number','placeholder="1・2・3など"')}</div><div><label>一律修理の目安</label><div data-flat="${i}" style="padding-top:8px;font-weight:700"></div></div></div><p class="note">保証年数を入れると、保証年月日は購入年月日から自動計算されます。</p><div class="card"><b>紛失保証</b><label>紛失保証</label><select data-p="ha.${i}.lg" onchange="setTimeout(()=>render(),0)"><option value="">無</option><option value="1">有</option></select>${a.lg?`<div class="g2"><div><label>保証年数（年）</label>${inp(`ha.${i}.lgY`,'number','placeholder="例 1"')}</div><div><label>保証回数（回）</label>${inp(`ha.${i}.lgN`,'number','placeholder="例 1"')}</div></div><div data-lgexp="${i}" style="margin-top:6px;font-weight:700"></div>`:''}</div><div class="card"><b>自由項目</b><p class="note">項目名と内容を自由に追加できます。</p>${(a.extra||[]).map((x,j)=>`<div class="g2" style="margin-bottom:6px"><input type="text" data-p="ha.${i}.extra.${j}.k" placeholder="項目名"><div style="display:flex;gap:6px"><input type="text" data-p="ha.${i}.extra.${j}.v" placeholder="内容"><button type="button" onclick="delExtra(${i},${j})">×</button></div></div>`).join('')}<button class="p" onclick="addExtra(${i})">＋項目を追加</button></div>${ear('R')}${ear('L')}`});h+='<button class="p" onclick="addHa()">＋買い替え・追加</button>'}
if(V.tab=='s'){h=`<div class="card"><label>測定日</label>${inp('sp.date','date')}</div>`+spBody('sp','')+(c.sps||[]).map((m,j)=>`<h3 style="margin-top:20px">再測定 ${j+1}<button type="button" onclick="delSp(${j})" style="float:right">×削除</button></h3><div class="card"><label>測定日</label>${inp(`sps.${j}.date`,'date')}</div>`+spBody(`sps.${j}`,'r'+j)).join('')+`<button class="p" onclick="addSp()">＋再測定を追加</button>`}
if(V.tab=='n'){if(!c.consults)c.consults=c.memo?[{date:'',content:c.memo,adj:''}]:[];
h=`<div class="card"><b>耳鼻科医師への相談が必要な項目（禁忌8項目）</b><table class="chk">${KINKI.map((k,i)=>`<tr><td>${k}</td><td><input type="checkbox" data-p="cj.${i}"></td></tr>`).join('')}</table><div class="warn" id="kw" hidden>1つ以上該当：耳鼻咽喉科医師にご相談ください</div></div>`+c.consults.map((m,j)=>`<div class="card"><div class="g2"><div><label>日付</label>${inp(`consults.${j}.date`,'date')}</div><div style="text-align:right"><button type="button" onclick="delConsult(${j})">×削除</button></div></div><label>相談内容</label><textarea rows="4" data-p="consults.${j}.content"></textarea><label>調整内容</label><textarea rows="4" data-p="consults.${j}.adj"></textarea></div>`).join('')+`<button class="p" onclick="addConsult()">＋相談を追加</button>`}
if(V.tab=='r'){h=`<div class="card"><b>依頼書を作成</b><p class="note">押すと依頼書の入力画面が開きます。補聴器を選ぶと、店名・氏名・製造No・購入日が自動で入ります。</p><button class="p" onclick="reqDoc('repair')">🔧 修理依頼書</button></div><div class="card"><b>修理</b><p class="note">修理日・修理内容・金額を入力して保存できます。</p>${(c.repairs||[]).map((r,i)=>`<div class="repair-row"><input type="date" data-p="repairs.${i}.date"><textarea rows="1" placeholder="修理内容" data-p="repairs.${i}.content"></textarea><input type="number" min="0" placeholder="金額（円）" data-p="repairs.${i}.amount"><button type="button" onclick="delRepair(${i})">×</button></div>`).join('')||'<p>修理はまだありません。</p>'}<button class="p" onclick="addRepair()">＋修理を追加</button></div>`}
if(V.tab=='o')h=histCard(c)+`<div class="card">注文書に <b>お客様名・ふりがな・性別・年齢</b> と店名・担当・電話・FAXが自動入力されます。様式を選んでください。</div><div class="card"><b>紛失依頼書</b><p class="note">この顧客の紛失保証注文書を作成します。開いた先で補聴器を選ぶと、氏名・製造No・購入日が自動で入ります。</p><button class="p" onclick="reqDoc('loss')">📄 紛失依頼</button></div>${FORMS.map(b=>`<h3 style="color:${b[1]}">${b[0]}</h3><div class="ord">${b[2].map(f=>`<button style="border-left:5px solid ${b[1]}" onclick="order('${f[0]}')">${f[1]}</button>`).join('')}</div>`).join('')}`;
x.innerHTML=h;fill(x,c);x.oninput=x.onchange=e=>{const t=e.target;if(!t.dataset.p)return;sp(c,t.dataset.p,t.type=='checkbox'?t.checked:t.value);sv();calc(c)};calc(c)}
function addY(d,y){if(!d||!y)return'';const t=new Date(d+'T00:00:00');if(isNaN(t))return'';t.setFullYear(t.getFullYear()+ +y);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function fmtD(d){if(!d)return'';const[a,b,c]=d.split('-').map(Number);return a+'年'+b+'月'+c+'日'}
function flatP(h){const lim=addY(h.buy,5);return lim&&today()<=lim?'26,000円（購入から5年以内）':'52,000円（購入から5年を経過）'}
function haCalc(c){(c.ha||[]).forEach((h,i)=>{
if(h.wrY&&h.buy){const w=addY(h.buy,h.wrY);if(w&&h.wr!==w){h.wr=w;const el=document.querySelector('[data-p="ha.'+i+'.wr"]');if(el)el.value=w;sv()}}
const fe=document.querySelector('[data-flat="'+i+'"]');if(fe)fe.textContent=h.buy?('一律修理の目安：'+flatP(h)):'';

function xe(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(files){const enc=new TextEncoder();let off=0;const chunks=[],central=[];
for(const f of files){const name=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,name.length,true);
chunks.push(new Uint8Array(lh.buffer),name,f.data);
const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
central.push(new Uint8Array(ch.buffer),name);off+=30+name.length+sz}
const cd=central.reduce((a,c)=>a+c.length,0);const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cd,true);end.setUint32(16,off,true);
return new Blob([...chunks,...central,new Uint8Array(end.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
