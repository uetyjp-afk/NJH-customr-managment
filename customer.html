<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NJH 顧客管理</title><link rel="icon" href="./icons/icon-192.png">
<style>
:root{--g:#208b4f;--gl:#e8f4ed;--b:#d6dcd8;--t:#1d2a22;--r:#d01818;--bl:#1747c8}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--t);background:#f6f8f6;padding-bottom:60px}
header{background:var(--g);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:5}
header b{flex:1;font-size:16px}header small{display:block;font-weight:400;font-size:11px;opacity:.9}
button{font:inherit;border:1px solid var(--b);background:#fff;border-radius:8px;padding:7px 12px;color:var(--t)}
header button{background:rgba(255,255,255,.18);color:#fff;border-color:transparent;padding:5px 9px;font-size:13px}
button.p{background:var(--g);color:#fff;border-color:var(--g)}button.on{background:var(--g);color:#fff;border-color:var(--g)}
main{padding:12px;max-width:760px;margin:auto}
input,select,textarea{font:inherit;width:100%;padding:7px 8px;border:1px solid var(--b);border-radius:8px;background:#fff}
input[type=checkbox]{width:20px;height:20px}label{font-size:13px;color:#4b5d52;display:block;margin:8px 0 2px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.li{display:flex;gap:10px;align-items:center;cursor:pointer}.li .no{background:var(--gl);color:var(--g);border-radius:6px;padding:2px 8px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}h3{margin:14px 0 6px;font-size:15px;color:var(--g)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--b);padding:2px;text-align:center;font-size:12px}
td input{width:52px;padding:5px 2px;text-align:center}input[data-p^="au."]{width:60px;padding:10px 2px;font-size:16px}th{background:var(--gl)}.R{color:var(--r)}.L{color:var(--bl)}
.pct{font-size:20px;font-weight:700}.warn{background:#fff3f0;border:1px solid #f1b5a8;border-radius:8px;padding:6px 10px;color:#a3260f;margin:6px 0}
.ok td,.ok th{font-size:13px}.chk td{padding:3px 6px}.chk td:first-child{text-align:left}
.ord{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ord button{padding:12px 6px}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin-top:10px}.badge{display:inline-block;background:var(--gl);color:var(--g);border-radius:999px;padding:2px 7px;margin:2px;font-size:11px}.repair-row{display:grid;grid-template-columns:125px 1fr 105px 34px;gap:6px;align-items:center;margin-bottom:7px}@media(max-width:560px){.filters{grid-template-columns:1fr 1fr}.repair-row{grid-template-columns:1fr 1fr}.repair-row textarea{grid-column:1/-1}}

/* レスポンシブ追加: PCでは広く、スマホでは入力時に画面がズームしないように */
@media(min-width:1024px){main{max-width:1120px}.ord{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){#ls{display:grid;grid-template-columns:1fr 1fr;gap:10px}#ls .card{margin:0}}
@media(max-width:768px){input,select,textarea{font-size:16px}}
.phr{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}.phr button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--b);background:var(--gl);color:var(--t);cursor:pointer}


/* ===== プレミアムテーマ（高級感のある業務ソフト風・見た目のみ） ===== */
@media screen{
:root{--g:#0e7a40;--g2:#12a35c;--gl:#e7f3ec;--b:#d3ded5;--ink:#16281d;--sub:#5a6f61;--ring:rgba(18,163,92,.18)}
body{background:linear-gradient(180deg,#e6f0e9 0,#f2f6f2 260px,#f4f7f4 100%);background-attachment:fixed;color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(120deg,#0a5c31,#0e7a40 55%,#12a35c);box-shadow:0 4px 18px -4px rgba(8,70,38,.45);padding:12px 14px}
header b{font-size:17px;letter-spacing:.03em}
header small{opacity:.85}
header button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;backdrop-filter:blur(2px)}

main{padding:16px 12px 24px}
.card{background:#fff;border:1px solid #e1eae3;border-radius:16px;box-shadow:0 1px 2px rgba(15,45,28,.05),0 10px 28px -14px rgba(15,45,28,.18);padding:14px 15px;margin-bottom:12px}
.card.li{transition:box-shadow .15s ease,transform .15s ease}
.card.li:active{transform:scale(.995)}
h3{color:#0b5a31;font-size:15px;background:linear-gradient(90deg,#e9f4ed,#f5faf6);border-left:4px solid var(--g2);border-radius:0 10px 10px 0;padding:7px 10px;margin:16px 0 8px;letter-spacing:.02em}
label{font-size:12px;font-weight:600;color:#33503f;letter-spacing:.03em;margin:10px 0 3px}
input,select,textarea{background:#fbfdfb;border:1.5px solid #c9d8cc;border-radius:10px;padding:9px 10px;transition:border-color .12s,box-shadow .12s,background .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g2);background:#fff;box-shadow:0 0 0 3.5px var(--ring)}
button{border:1px solid #c9d8cc;border-radius:10px;padding:8px 13px;box-shadow:0 1px 2px rgba(15,45,28,.06);transition:box-shadow .12s,transform .08s,background .12s;cursor:pointer}
button:active{transform:scale(.98)}
button.p,button.on{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border-color:transparent;font-weight:700;box-shadow:0 5px 12px -3px rgba(14,122,64,.5)}
.tabs{gap:7px;padding:3px 1px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border-radius:999px;padding:8px 15px;font-weight:600;background:#fff;border:1px solid #cfddd1;box-shadow:0 1px 3px rgba(15,45,28,.07);white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border-color:transparent;box-shadow:0 6px 14px -4px rgba(14,122,64,.55)}
.li .no{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border-radius:8px;padding:3px 9px;box-shadow:0 2px 6px -1px rgba(14,122,64,.4)}
.li small{color:var(--sub)}
.badge{background:var(--gl);color:#0b5a31;border:1px solid #cfe4d6}
th{background:#e9f3ec;color:#24402f}
th,td{border-color:#dde7de}
td input{padding:5px 2px}
input[data-p^="au."]{padding:10px 2px;border-radius:8px}
.warn{border-radius:10px}
.phr button{border-radius:999px;box-shadow:none}
.phr button:active{background:#d8ecdd}
.ord button{padding:14px 6px;font-weight:600}
::selection{background:#bfe6cf}
}

/* ===== 印刷用 ===== */
#printArea{display:none}
@media print{
body>*{display:none!important}
body{padding:0;background:#fff}
#printArea{display:block!important}
.pr-list h2{font-size:15px;margin:0 0 2px}
.pr-list .pr-date{font-size:10px;color:#555;margin:0 0 8px}
.pr-list table{border-collapse:collapse;width:100%;font-size:10.5px}
.pr-list th,.pr-list td{border:1px solid #999;padding:4px 6px;text-align:left}
.pr-list th{background:#eee}
.hg{width:100mm;height:148mm;position:relative;overflow:hidden;page-break-after:always;break-after:page}
.hg:last-child{page-break-after:auto;break-after:auto}
.hg-in{position:absolute;inset:0}
.hg-zip{position:absolute;top:6.5mm;left:0;width:100mm;height:8mm}
.hg-zip span{position:absolute;width:6mm;text-align:center;font-size:15pt;line-height:1}
.hg-addr{position:absolute;top:24mm;left:9mm;width:82mm;font-size:11.5pt;line-height:1.75}
.hg-name{position:absolute;top:56mm;left:9mm;font-size:17pt;font-weight:700;letter-spacing:2px}
.hg-sama{font-size:13pt;font-weight:400}
.hg-from{position:absolute;bottom:9mm;left:9mm;font-size:8.5pt;color:#333;line-height:1.5}
}

/* ===== 狭い画面ではヘッダーのボタンを折り返す（はみ出し対策） ===== */
@media (max-width: 640px) {
  header { flex-wrap: wrap; gap: 6px; }
  header b { min-width: 0; font-size: 14px; }
}

<script>
const K='njhc',$=s=>document.querySelector(s),FR=[125,250,500,1000,2000,3000,4000,8000];
const WORDS='からす さかな はさみ ライオン りんご じどうしゃ つくえ ピアノ ひこうき うさぎ ねずみ でんわ めがね えんぴつ バナナ すずめ ポスト とけい ぼうし テレビ'.split(' ');
const SYL={R:[...'アキシタニヨジウクスネハリバオテモワトガ'],L:[...'キタヨウスハバテワガアシニジクネリオモト']};
const COND=[['R','b','右 裸耳'],['L','b','左 裸耳'],['R','w','右 装用耳'],['L','w','左 装用耳']];

const BAT=['','312','13','10A','675','充電式'],RC=['','M','P','HP','SP','UP','LP','MP','MR','その他'];
const FORMS=[['Unitron','#0a8f48',[['insera_sr','Insera Smile R'],['moxisr','Moxi S-R'],['vivante','Moxi Vivante R / 312 / RS'],['stride','Stride V-PR'],['stride_sp','Stride V-SP / UP'],['moxiblu','Moxi Blu R / 312'],['uni_mold','ユニトロン RIC用モールド']]],['Beltone','#00528c',[['beltone_custom','充電式オーダーメイド'],['env6264','Envision 62S / 64DW'],['envcros','Envision クロス送信機'],['commence','Commence 62 / 64DW'],['serene6263','Serene 62S / 63DW'],['serene7686','Serene 76 / 86 DW'],['serene_cros','Serene クロス送信機'],['rely_ric','Rely RIC'],['rely_bte','Rely BTE'],['boost_max','Boost Max S'],['boost_ultra','Boost Ultra'],['bel_mold','ベルトーン RIC用モールド']]],['その他','#b26a00',[['hosho','NJH安心ほしょう']]]];
let D={shop:{},seq:1,cs:[]};try{Object.assign(D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}

if(!D.shop.name)D.shop={name:ls('shop'),staff:ls('contact'),tel:ls('tel'),fax:ls('fax'),sno:''};
Object.values(D.cs||[]).forEach(c=>{if(!Array.isArray(c.repairs))c.repairs=[];(c.au||[]).forEach(u=>{['ac','bc','ucl','ad'].forEach(k=>{if(!u[k])u[k]={R:{},L:{}}})})});
let V={mode:D.shop.name?'list':'setup',id:null,tab:'b',q:'',filter:'all',month:'',bmonth:''};
try{const _cf=localStorage.getItem('njhc_cust_filter');if(_cf==='stale'||_cf==='warranty'){V.filter=_cf;localStorage.removeItem('njhc_cust_filter')}}catch(e){}
let _svWarned=false;const sv=()=>{try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){if(!_svWarned){_svWarned=true;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='顧客データ_保存失敗_'+today()+'.json';a.click()}catch(_){}alert('保存できませんでした（端末の容量がいっぱいの可能性があります）。今の顧客データをファイルでダウンロードしました。「バックアップ保存」でも書き出せますので、端末の空きを確保してから復元してください。')}return false}};
const today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newAu=()=>({date:today(),ac:{R:{},L:{}},bc:{R:{},L:{}},ucl:{R:{},L:{}},ad:{R:{},L:{}}});
const newEar=()=>({model:'',no:'',vol:'',rc:'',tube:'',ear:'',bat:'',extra:[]});
const newHa=()=>({buy:'',wr:'',wrY:'',lg:'',lgY:'',lgN:'',lgExp:'',lgAmt:'',extra:[],R:newEar(),L:newEar()});
const newC=()=>({id:Date.now(),no:String(D.seq++).padStart(4,'0'),kana:'',name:'',sex:'',birth:'',tel:'',zip:'',addr:'',au:[newAu()],ha:[newHa()],sp:{date:'',w:{},s:{}},sps:[],cj:{},memo:'',next:'',extra:[],repairs:[],reqs:[],loans:[],visits:[],photos:[]});const inWarrantyWindow=c=>c.ha.some(h=>{if(!h.wr)return false;const t=new Date(today()),d=new Date(h.wr+'T00:00:00'),e=new Date(t);e.setMonth(e.getMonth()+2);return d>=t&&d<=e});const monthMatch=(v,m)=>!m||String(v||'').slice(0,7)===m;
const cur=()=>D.cs.find(c=>c.id===V.id);
function age(b){if(!b)return'';const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>=0&&a<131?a:''}
function gp(o,p){return p.split('.').reduce((x,k)=>x==null?x:x[k],o)}
function sp(o,p,v){const a=p.split('.');a.slice(0,-1).forEach(k=>o=o[k]??(o[k]={}));o[a.at(-1)]=v}
const inp=(p,t='text',x='')=>`<input type="${t}" data-p="${p}" ${x}>`;
const sel=(p,o)=>`<select data-p="${p}">${o.map(v=>`<option>${v}</option>`).join('')}</select>`;
function fill(root,c){root.querySelectorAll('[data-p]').forEach(e=>{const v=gp(c,e.dataset.p);if(e.type=='checkbox')e.checked=!!v;else e.value=v??''})}
/* ===== 印刷（顧客の選択・一覧印刷・ハガキ宛名） ===== */
const SEL = new Set();
const HIT = new Map();
let ADJ = { x: 0, y: 0 };
try { ADJ = Object.assign(ADJ, JSON.parse(localStorage.getItem('njhc_pradj') || '{}')); } catch (e) {}
function freeHit(c, q) {
  const cats = [
    ['メモ', [c.memo]],
    ['相談・処置', (c.consults || []).flatMap(m => [m.content, m.adj])],
    ['修理・紛失', (c.reqs || []).flatMap(r => [r.summary, r.formName])],
    ['注文', (c.orders || []).flatMap(o => [o.summary, o.formName, o.model])],
    ['来店記録', (c.visits || []).map(v => v.content)],
    ['貸出', (c.loans || []).flatMap(l => [l.kansou, l.note])],

  ];
  for (const [lab, arr] of cats) { if (arr.some(s => String(s || '').toLowerCase().includes(q))) return lab; }
  return '';
}
function bulkDel() {
  if (!SEL.size) { alert('削除する顧客にチェックを入れてください'); return; }
  const targets = D.cs.filter(c => SEL.has(c.id));
  if (!targets.length) { alert('対象の顧客が見つかりませんでした'); return; }
  let o = document.getElementById('delModal'); if (o) o.remove();
  o = document.createElement('div'); o.id = 'delModal';
  o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:220;display:flex;align-items:center;justify-content:center;padding:16px';
  const names = targets.map(c => '<div style="padding:3px 0;border-bottom:1px solid #eef1f4">' + esc(c.no || '') + '　' + esc(c.name || '（未入力）') + '</div>').join('');
  o.innerHTML = '<div style="background:#fff;border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto"><b style="font-size:17px;color:#c62828">顧客の削除（1/2）確認</b><p style="margin:10px 0">次の <b>' + targets.length + '名</b> を削除します。よろしいですか？</p><div style="max-height:38vh;overflow:auto;border:1px solid #e3e9ee;border-radius:8px;padding:6px 10px">' + names + '</div><div style="display:flex;gap:10px;margin-top:14px"><button type="button" id="delNo1" style="flex:1;min-height:48px;border-radius:10px;cursor:pointer">キャンセル</button><button type="button" id="delNext" style="flex:1;min-height:48px;border-radius:10px;background:#c62828;color:#fff;border:0;font-weight:700;cursor:pointer">次へ（最終確認）</button></div></div>';
  document.body.appendChild(o);
  o.querySelector('#delNo1').onclick = () => o.remove();
  o.querySelector('#delNext').onclick = () => {
    o.innerHTML = '<div style="background:#fff;border-radius:14px;padding:18px;width:100%;max-width:440px"><b style="font-size:17px;color:#c62828">顧客の削除（2/2）最終確認</b><p style="margin:10px 0"><b>' + targets.length + '名</b>を削除します。<b>この操作は元に戻せません。</b></p><p class="note">削除の直前に、今の全データを「顧客データ_削除前_日付.json」として自動で保存します。万一のときは、そのファイルから復元できます。</p><div style="display:flex;gap:10px;margin-top:14px"><button type="button" id="delNo2" style="flex:1;min-height:48px;border-radius:10px;cursor:pointer">やめる</button><button type="button" id="delGo" style="flex:1;min-height:48px;border-radius:10px;background:#c62828;color:#fff;border:0;font-weight:700;cursor:pointer">' + targets.length + '名を削除する</button></div></div>';
    o.querySelector('#delNo2').onclick = () => o.remove();
    o.querySelector('#delGo').onclick = () => {
      const a = document.createElement('a');

  };
}
function prTargets() { const ids = SEL.size ? [...SEL] : (V.shownIds || []); const map = {}; D.cs.forEach(c => map[c.id] = c); return ids.map(id => map[id]).filter(Boolean); }
function updPr() { const el = document.getElementById('prCnt'); if (!el) return; el.textContent = SEL.size ? ('選択中 ' + SEL.size + ' 名（この方々を印刷します）') : ('未選択のため、表示中の ' + (V.shownIds || []).length + ' 名が印刷対象です'); }
function selShown() { (V.shownIds || []).forEach(id => SEL.add(id)); render(); }

function prSetPage(css) { let st = document.getElementById('pageStyle'); if (!st) { st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); } st.textContent = css; }
function prList() {

    prSetPage('@page{size:A4;margin:12mm}');

}
function prHagaki() {
    const t = prTargets(); if (!t.length) { alert('印刷する顧客がいません'); return; }
    const dx = ADJ.x || 0, dy = ADJ.y || 0;
    const lefts = [44.5, 51.8, 59.1, 70.1, 77.4, 84.7, 92.0];
    const pages = t.map(c => {

function auAvg(u,e){const v=[500,1000,2000,4000].map(f=>u.ac[e][f]);if(v.some(x=>x===''||x==null))return null;const n=v.map(Number);return{a3:(n[0]+2*n[1]+n[2])/4,a4:(n[0]+n[1]+n[2]+n[3])/4}}
